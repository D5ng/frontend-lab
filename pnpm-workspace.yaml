packages:
  - 'apps/*'
  - 'projects/*'
  - 'labs/*'
  - 'packages/*'

# 연습 앱들이 같은 SEED·Stackflow·MSW 버전을 쓰도록 버전을 여기서만 정한다.
# Stackflow 연동은 SEED CSS 2.8에 맞춰 @seed-design/stackflow 2.0.4와 Stackflow 1.x로 고정한다.
# (2.0.5부터 CSS 2.9 이상, plugin-renderer-basic 1.1.14부터 Stackflow 2.x를 요구한다.)
catalog:
  '@karrotmarket/react-monochrome-icon': ^1.29.0
  '@seed-design/cli': ^1.7.0
  '@seed-design/css': ^2.8.3
  '@seed-design/react': ^2.5.1
  '@seed-design/stackflow': 2.0.4
  '@stackflow/config': ^1.2.2
  '@stackflow/core': ^1.3.2
  '@stackflow/plugin-renderer-basic': 1.1.13
  '@stackflow/react': ^1.12.0
  msw: 3.0.3
  react: ^19.2.8
  react-dom: ^19.2.8
